<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="quiz-box">

            <h1>🧠 Quiz App</h1>

            <div class="progress">
                Question <span id="current">1</span> /
                <span id="total">5</span>
            </div>

            <h2 id="question">
                Question appears here
            </h2>

            <div id="options">
                <!-- Options generated by JavaScript -->
            </div>

            <button id="nextBtn">
                Next Question
            </button>

        </div>

        <div id="result" class="hidden">

            <h1>🎉 Quiz Completed</h1>

            <h2>
                Your Score:
                <span id="score"></span>
            </h2>

            <button onclick="restartQuiz()">
                Restart Quiz
            </button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
